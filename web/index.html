<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SCF Teamlog · Handball-Live-Statistik</title>
  <meta name="description" content="SCF Teamlog – Handball-Live-Statistik für den SC Freising: Spiele live erfassen, Kader verwalten, Auswertungen und Exporte. Offline nutzbar.">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SCF Teamlog">
  <link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Zum Inhalt springen</a>

  <header class="topbar no-print">
    <a class="brand" href="#/" aria-label="SCF Teamlog Startseite">
      <img class="logo-img logo-sm" src="img/logo.png" alt="" aria-hidden="true">
      <span class="brand-text">
        <span class="brand-name">SCF Teamlog</span>
        <span class="brand-sub">SC Freising · Handball</span>
      </span>
    </a>

    <nav class="main-nav" id="main-nav" aria-label="Hauptnavigation">
      <a href="#/" data-section="home"><span>Start</span></a>
      <a href="#/kader" data-section="squad"><span>Kader</span></a>
      <a href="#/statistik" data-section="stats"><span>Statistik</span></a>
      <a href="#/daten" data-section="data"><span>Daten</span></a>
    </nav>

    <div class="topbar-actions">
      <button id="install-btn" class="btn ghost sm hidden" type="button">App installieren</button>
      <a class="btn primary sm" href="#/spiel/neu">+ Neues Spiel</a>
    </div>
  </header>

  <main id="app" class="app-main" tabindex="-1">
    <div class="boot">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p>Lade SCF Teamlog …</p>
    </div>
  </main>

  <noscript>
    <p class="noscript">SCF Teamlog benötigt JavaScript.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
